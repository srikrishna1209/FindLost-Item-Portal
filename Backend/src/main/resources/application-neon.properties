# =========================================================
# NEON POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Kept as a fallback/local setting; Cloudinary handles actual uploads
file.upload-dir=${UPLOAD_DIR:uploads}

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

# =========================================================
# CLOUDINARY
# =========================================================

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}